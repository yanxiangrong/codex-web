name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.18.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Package release
        run: tar --exclude='*.tsbuildinfo' -czf codex-web-${GITHUB_REF_NAME}.tar.gz apps/server/dist apps/web/dist packages/*/dist package.json pnpm-lock.yaml pnpm-workspace.yaml README.md LICENSE THIRD_PARTY_NOTICES.md
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: codex-web-${{ github.ref_name }}.tar.gz
