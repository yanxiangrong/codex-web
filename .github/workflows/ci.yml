name: CI
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.18.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Build Docker image
        run: docker build --tag codex-web:ci .
      - name: Smoke-test bundled Codex CLI
        run: docker run --rm codex-web:ci codex --version
      - name: Smoke-test Docker HTTP service
        run: |
          docker run --detach --name codex-web-ci --publish 127.0.0.1:3199:3001 codex-web:ci
          trap 'docker rm --force codex-web-ci' EXIT
          curl --retry 20 --retry-delay 1 --retry-all-errors --fail http://127.0.0.1:3199/api/health || { docker logs codex-web-ci; exit 1; }
          curl --fail http://127.0.0.1:3199/api/codex/info
      - name: Validate Compose configuration
        run: docker compose config --quiet
